<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Login Seguro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;background:#111;color:#fff;margin:0}.box{background:#222;padding:30px;border-radius:12px;width:320px}input,button{width:100%;padding:12px;margin-top:10px;border-radius:8px;border:none;box-sizing:border-box}button{background:#00d084;font-weight:bold;cursor:pointer}#qr img{width:200px;margin:15px auto;display:block;background:#fff;padding:10px;border-radius:8px}#msg{color:#ff8a8a;margin-top:10px;font-size:13px}</style>
</head>
<body>
<div class="box">
<h2 style="margin:0">Sistema seguro 9 capas</h2><small>The Compass - Acceso Admin</small>
<div id="step1" style="margin-top:20px">
<input id="email" placeholder="email" value="carlopiste@gmail.com">
<input id="pass" type="password" placeholder="Contraseña">
<button id="btnLogin">ENTRAR</button>
</div>
<div id="stepQR" style="display:none">
<p>1. Escanea esto en Google Authenticator:</p>
<div id="qr"></div>
<p>2. Pon el código de 6 dígitos:</p>
<input id="code1" placeholder="123456">
<button id="btnVerifyEnroll">Verificar y Entrar</button>
</div>
<div id="stepCode" style="display:none">
<p>Pon tu código de Google Authenticator:</p>
<input id="code2" placeholder="123456">
<button id="btnVerify">Verificar código</button>
</div>
<p id="msg"></p>
</div>
<script>
const supabaseUrl = 'https://xhvpvpvtkdgnnxdwdrkn.supabase.co';
const supabaseAnon ='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhodnB2cHZ0a2Rnbm54ZHdkcmtuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwODk5MTEsImV4cCI6MjEwMjY2NTkxMX0.zsEMmjhbln24S25FnbKvlkic2djzON8QoXNLO8CtXA0';
const s = supabase.createClient(supabaseUrl, supabaseAnon);
let factorId = null; let challengeId = null;
const msg = document.getElementById('msg');
document.getElementById('btnLogin').onclick = async () => {
 msg.textContent = "Verificando...";
 const { data, error } = await s.auth.signInWithPassword({email: document.getElementById('email').value, password: document.getElementById('pass').value});
 if(error){ msg.textContent = error.message; return; }
 const { data: factors } = await s.auth.mfa.listFactors();
 if(factors.totp.length === 0){
   const { data: enroll, error: e1 } = await s.auth.mfa.enroll({ factorType: 'totp' });
   if(e1){ msg.textContent = e1.message; return; }
   factorId = enroll.id;
   const uri = enroll.totp.uri;
   document.getElementById('qr').innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(uri)}"><br><small style="word-break:break-all;color:#aaa">Si no escanea, pon manual: ${enroll.totp.secret}</small>`;
   document.getElementById('step1').style.display="none"; document.getElementById('stepQR').style.display="block"; msg.textContent="";
 } else {
   factorId = factors.totp[0].id;
   const { data: ch, error: e2 } = await s.auth.mfa.challenge({ factorId });
   if(e2){ msg.textContent = e2.message; return; }
   challengeId = ch.id;
   document.getElementById('step1').style.display="none"; document.getElementById('stepCode').style.display="block"; msg.textContent="Ahora pon el código";
 }
};
document.getElementById('btnVerifyEnroll').onclick = async () => {
 const { error } = await s.auth.mfa.challengeAndVerify({ factorId, code: document.getElementById('code1').value });
 if(error){ msg.textContent = error.message; return; }
 localStorage.setItem('admin_2fa_ok', Date.now());
 location.replace('./admin.html');
};
document.getElementById('btnVerify').onclick = async () => {
 const { error } = await s.auth.mfa.verify({ factorId, challengeId, code: document.getElementById('code2').value });
 if(error){ msg.textContent = error.message; return; }
 localStorage.setItem('admin_2fa_ok', Date.now());
 location.replace('./admin.html');
};
</script>
</body>
</html>
