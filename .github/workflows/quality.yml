name: EYESITE checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm check

      - name: Lint
        run: pnpm lint


  native-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate iOS native project
        run: pnpm exec expo prebuild --platform ios --no-install --clean

      - name: Validate Privacy Manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(find ios -name 'PrivacyInfo.xcprivacy' -type f -print -quit)"
          test -n "$manifest"
          grep -q 'NSPrivacyTracking' "$manifest"
          grep -q 'NSPrivacyCollectedDataTypes' "$manifest"
          grep -q 'NSPrivacyAccessedAPITypes' "$manifest"
          echo "Privacy manifest generated: $manifest"
