name: EYESITE checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm check

      - name: Lint
        id: lint
        continue-on-error: true
        run: |
          set +e
          pnpm lint > lint-report.txt 2>&1
          status=$?
          cat lint-report.txt
          exit $status

      - name: Publish temporary lint report
        if: steps.lint.outcome == 'failure' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lint-report.txt
          git commit -m "ci: temporary lint diagnostic [skip ci]" || true
          git push
