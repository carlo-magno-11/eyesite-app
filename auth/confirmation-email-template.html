<h2>Confirma tu correo en EYESITE</h2>
<p>Gracias por crear tu cuenta en EYESITE.</p>
<p>Para activar tu cuenta, confirma tu dirección de correo electrónico:</p>
<p>
  <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}"
     style="display:inline-block;padding:12px 20px;background:#C9A84C;color:#0E0E0E;text-decoration:none;border-radius:8px;font-weight:bold;">
    CONFIRMAR MI CORREO
  </a>
</p>
<p>Después de confirmar tu correo podrás continuar con EYESITE.</p>
<p>Si tú no creaste esta cuenta, puedes ignorar este mensaje.</p>
